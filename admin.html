<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Umesh Stores - Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="padding: 30px; background: #f5f7fb; font-family: 'Poppins', sans-serif;">
  <div style="max-width: 800px; margin: auto;">
    <h2>📦 Vaviya Stores - Incoming Orders</h2>
    <p style="color: #697386; margin-bottom: 20px;">Real-time orders fetched from your MongoDB database.</p>
    <div id="ordersList">Loading orders...</div>
  </div>

  <script>
    async function fetchOrders() {
      try {
        const response = await fetch('http://localhost:5000/api/orders');
        const orders = await response.json();
        
        const container = document.getElementById('ordersList');
        if (!orders.length) {
          container.innerHTML = '<p>No orders received yet.</p>';
          return;
        }

        container.innerHTML = orders.map(o => `
          <div style="background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 5px solid #172c67;">
            <h3 style="margin-bottom: 8px;">Order: ${o.orderNumber} <span style="font-size: 13px; color: #697386; float: right; font-weight: normal;">${new Date(o.createdAt).toLocaleString()}</span></h3>
            <p><b>Customer:</b> ${o.name} (${o.phone})</p>
            <p><b>Address:</b> ${o.address}</p>
            <p><b>Payment Method:</b> ${o.payment}</p>
            <p><b>Total Amount:</b> ₹${o.total}</p>
            <hr style="margin: 12px 0; border: 0; border-top: 1px solid #e7e9ef;">
            <b style="font-size: 13px;">Items Ordered:</b>
            <ul style="margin-top: 5px; padding-left: 20px; font-size: 13px;">
              ${o.items.map(i => `<li>${i.name} × ${i.qty} (₹${i.price * i.qty})</li>`).join('')}
            </ul>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('ordersList').innerHTML = '<p style="color: red;">Could not connect to backend server. Make sure "node server.js" is running in your terminal.</p>';
      }
    }
    fetchOrders();
    // Refresh orders automatically every 10 seconds
    setInterval(fetchOrders, 10000);
  </script>
</body>
</html>
